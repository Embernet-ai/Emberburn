apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "emberburn.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "emberburn.labels" . | nindent 4 }}
    {{- with .Values.pod.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.pod.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  strategy:
    type: Recreate
  {{- /* Omit replicas when the HPA owns this Deployment, otherwise every
         helm upgrade resets the replica count the autoscaler just set. */}}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.pod.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "emberburn.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "emberburn.selectorLabels" . | nindent 8 }}
        {{- include "emberburn.storeLabels" . | nindent 8 }}
        {{- if .Values.embernet.device }}
        embernet.ai/device: {{ .Values.embernet.device | quote }}
        {{- end }}
        # Injected by the dashboard at deploy time (store.go:1304-1315). Without
        # these the pod carries no embernet.ai/tenant, so POD SHELL returns 403
        # "belongs to another tenant" (shell.go:602-615).
        {{- with .Values.tenantLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.pod.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Read from pod annotations too, not just the Service — setting it only
        # on the Service leaves node cards showing a generic glyph.
        embernet.ai/app-icon: {{ include "emberburn.appIcon" . | quote }}
        {{- if .Values.embernet.displayName }}
        embernet.ai/display-name: {{ .Values.embernet.displayName | quote }}
        {{- end }}
        {{- with .Values.pod.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "emberburn.serviceAccountName" . }}
      {{- if .Values.network.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- else }}
      dnsPolicy: ClusterFirst
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: {{ .Values.emberburn.securityContext.fsGroup }}
      containers:
      - name: emberburn
        image: "{{ .Values.emberburn.image.repository }}:{{ .Values.emberburn.image.tag }}"
        imagePullPolicy: {{ .Values.emberburn.image.pullPolicy }}
        {{- /*
          The image CMD points at a config baked into the image. Without this
          `-c` the mounted ConfigMap is never read and the chart's tags and
          publishers do nothing at all — the pod runs the shipped demo tags and
          publishes nowhere, while looking perfectly healthy.
        */}}
        args:
        - "-c"
        - {{ include "emberburn.configPath" . | quote }}
        - "-l"
        - {{ .Values.emberburn.opcua.logLevel | quote }}
        ports:
        # IMPORTANT: webui MUST be the first port listed.
        # The Embernet Dashboard picks the first containerPort for "Launch UI" proxy.
        - name: webui
          containerPort: {{ .Values.emberburn.ports.webui }}
          protocol: TCP
        - name: opcua
          containerPort: {{ .Values.emberburn.ports.opcua }}
          protocol: TCP
        - name: prometheus
          containerPort: {{ .Values.emberburn.ports.prometheus }}
          protocol: TCP
        env:
        {{- /*
          Sparkplug broker credentials come from a Secret, never the ConfigMap.
          publishers.py prefers EMBERBURN_SPARKPLUG_* over its config file, so
          the rendered publisher config carries only non-secret settings while
          the password stays in the Secret. Mirrors the Ignition-Edge-Pod
          existingSecret/passwordKey convention.
        */}}
        {{- with .Values.config.publishers.sparkplug_b }}
        {{- if .existingSecret }}
        - name: EMBERBURN_SPARKPLUG_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .existingSecret | quote }}
              key: {{ .usernameKey | default "username" | quote }}
        - name: EMBERBURN_SPARKPLUG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .existingSecret | quote }}
              key: {{ .passwordKey | default "password" | quote }}
        {{- end }}
        {{- end }}
        - name: PYTHONUNBUFFERED
          value: {{ .Values.emberburn.env.pythonUnbuffered | quote }}
        - name: UPDATE_INTERVAL
          value: {{ .Values.emberburn.opcua.updateInterval | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.emberburn.opcua.logLevel | quote }}
        - name: OPC_ENDPOINT
          value: {{ .Values.emberburn.opcua.endpoint | quote }}
        - name: OPC_SERVER_NAME
          value: {{ .Values.emberburn.opcua.serverName | quote }}
        - name: OPC_NAMESPACE
          value: {{ .Values.emberburn.opcua.namespace | quote }}
        - name: OPC_DEVICE_NAME
          value: {{ .Values.emberburn.opcua.deviceName | quote }}
        # ── REST API security ──
        - name: EMBERBURN_UI_WRITES
          value: {{ .Values.security.uiWrites | quote }}
        - name: EMBERBURN_CORS_ORIGINS
          value: {{ join "," .Values.security.corsOrigins | quote }}
        - name: EMBERBURN_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "emberburn.secretName" . }}
              key: apiKey
              optional: true
        # ── OPC UA security (opt-in; breaks anonymous clients when enabled) ──
        - name: OPC_SECURITY_ENABLED
          value: {{ .Values.security.opcua.enabled | quote }}
        - name: OPC_ALLOW_ANONYMOUS
          value: {{ .Values.security.opcua.allowAnonymous | quote }}
        {{- if .Values.security.opcua.enabled }}
        - name: OPC_CERT_FILE
          value: {{ .Values.security.opcua.certFile | quote }}
        - name: OPC_KEY_FILE
          value: {{ .Values.security.opcua.keyFile | quote }}
        {{- end }}
        {{- if not .Values.security.opcua.allowAnonymous }}
        - name: OPC_USERS
          valueFrom:
            secretKeyRef:
              name: {{ include "emberburn.secretName" . }}
              key: opcuaUsers
        {{- end }}
        volumeMounts:
        {{- if .Values.persistence.enabled }}
        - name: data
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
        - name: app-config
          mountPath: {{ include "emberburn.configPath" . }}
          subPath: emberburn.json
        resources:
          {{- include "emberburn.resources" . | nindent 10 }}
        {{- if .Values.emberburn.livenessProbe.enabled }}
        livenessProbe:
          tcpSocket:
            port: {{ .Values.emberburn.livenessProbe.tcpSocket.port }}
          initialDelaySeconds: {{ .Values.emberburn.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.emberburn.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.emberburn.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.emberburn.livenessProbe.failureThreshold }}
        {{- end }}
        {{- if .Values.emberburn.readinessProbe.enabled }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.emberburn.readinessProbe.tcpSocket.port }}
          initialDelaySeconds: {{ .Values.emberburn.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.emberburn.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.emberburn.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.emberburn.readinessProbe.failureThreshold }}
        {{- end }}
        securityContext:
          runAsUser: {{ .Values.emberburn.securityContext.runAsUser }}
          runAsGroup: {{ .Values.emberburn.securityContext.runAsGroup }}
          runAsNonRoot: {{ .Values.emberburn.securityContext.runAsNonRoot }}
          allowPrivilegeEscalation: {{ .Values.emberburn.securityContext.allowPrivilegeEscalation }}
          readOnlyRootFilesystem: {{ .Values.emberburn.securityContext.readOnlyRootFilesystem }}
          capabilities:
            drop:
              {{- toYaml .Values.emberburn.securityContext.capabilities.drop | nindent 14 }}
      volumes:
      {{- if .Values.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "emberburn.pvcName" . }}
      {{- end }}
      - name: app-config
        configMap:
          name: {{ include "emberburn.configMapName" . }}
      restartPolicy: Always
