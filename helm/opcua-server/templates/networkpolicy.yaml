{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "emberburn.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "emberburn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "emberburn.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
  {{- $otPorts := include "emberburn.otPorts" . | fromJsonArray }}
  {{- if or .Values.networkPolicy.ingress $otPorts }}
  ingress:
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $otPorts }}
    # Simulated OT protocols that are enabled: without this, turning the policy
    # on would cut them off while the pod still reported healthy.
    - from:
        - namespaceSelector: {}
      ports:
      {{- range $otPorts }}
        - protocol: {{ .protocol }}
          port: {{ .port }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if .Values.networkPolicy.egress }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
  {{- end }}
{{- end }}
