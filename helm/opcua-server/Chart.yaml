    email: patrick@fireballz.ai
    url: https://fireballz.ai

# Icon is embedded as a data URI, not an external URL. Embernet clusters are
# air-gapped, so a remote icon renders as a broken image in the app catalog.
# Regenerate from static/images/emberburn-chart-icon.png via scripts/build-chart-icon.py
icon: data:image/png;base64,

