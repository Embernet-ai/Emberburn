apiVersion: v2
name: emberburn
description: |
  OPC UA server that simulates factory tags and publishes them over twelve
  protocols, with a web UI for creating and watching tags.

  EmberBurn serves OPC UA and pushes the same data out over MQTT, Sparkplug B,
  Kafka, AMQP, WebSocket, Modbus TCP, InfluxDB, GraphQL, a REST API, an OPC UA
  client, and a Prometheus endpoint. Alarms, SQLite persistence, and data
  transformation ride on top of those. It can also serve the tags as an
  EtherNet/IP controller, an S7 CPU, a BACnet device, a DNP3 outstation, an
  IEC 104 station, or GOOSE, PROFINET and EtherCAT frames, for protocol analyzer and
  intrusion detection testing.

type: application
version: 4.9.1
appVersion: "4.9.1"

keywords:
  - opcua
  - industrial-iot
  - scada
  - mqtt
  - modbus
  - prometheus
  - graphql
  - data-transformation
  - emberburn
  - fireball-industries
  - forge-industrial

home: https://fireballz.ai/emberburn
sources:
