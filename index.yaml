    appVersion: 4.9.1
    created: "2026-11-24T01:38:53.332331783Z"
    description: 'OPC UA server that simulates factory tags and publishes them over
      twelve protocols, with a web UI for creating and watching tags.  EmberBurn serves
      OPC UA and pushes the same data out over MQTT, Sparkplug B, Kafka, AMQP, WebSocket,
      Modbus TCP, InfluxDB, GraphQL, a REST API, an OPC UA client, and a Prometheus
      endpoint. Alarms, SQLite persistence, and data transformation ride on top of
      those. It can also serve the tags as an EtherNet/IP controller, an S7 CPU, a
      BACnet device, a DNP3 outstation, an IEC 104 station, or GOOSE, PROFINET and
      EtherCAT frames, for protocol analyzer and intrusion detection testing. '
    digest: a6c9807f6f937b291446203bfff382796d7d12fabf24cefc080a3f07a24fff8e
