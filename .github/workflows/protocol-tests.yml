name: Protocol Tests

# The OT protocol simulators under protocols/ are checked with independent
# clients on the wire, not by importing the module: a simulator that only
# talks to itself proves nothing. Each protocol's test is listed here and in
# RELEASE_CHECKLIST.md section 5.
on:
  push:
    branches: [main]
    paths:
      - 'protocols/**'
      - 'publishers.py'
      - 'test_enip.py'
      - 'test_modbus.py'
      - 'test_s7.py'
      - 'test_bacnet.py'
      - 'test_dnp3.py'
      - 'test_iec104.py'
      - 'test_goose.py'
      - 'test_profinet.py'
      - 'test_ethercat.py'
      - 'test_signin.py'
      - 'embernet_signin.py'
      - 'requirements.txt'
      - '.github/workflows/protocol-tests.yml'
  pull_request:
    paths:
      - 'protocols/**'
      - 'publishers.py'
      - 'test_enip.py'
      - 'test_modbus.py'
      - 'test_s7.py'
      - 'test_bacnet.py'
      - 'test_dnp3.py'
      - 'test_iec104.py'
      - 'test_goose.py'
      - 'test_profinet.py'
      - 'test_ethercat.py'
      - 'test_signin.py'
      - 'embernet_signin.py'
      - 'requirements.txt'
      - '.github/workflows/protocol-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          set -o pipefail
          pip install -r requirements.txt pycomm3==1.2.16
      - name: EtherNet/IP and CIP
        run: |
          set -o pipefail
          python test_enip.py | tee /tmp/enip.log
          grep -q '^4/4$' /tmp/enip.log
      - name: S7comm
        run: |
          set -o pipefail
          python test_s7.py | tee /tmp/s7.log
          grep -q '^2/2$' /tmp/s7.log
      - name: BACnet/IP
        run: |
          set -o pipefail
          python test_bacnet.py | tee /tmp/bacnet.log
          grep -q '^2/2$' /tmp/bacnet.log
      - name: DNP3
        run: |
          set -o pipefail
          python test_dnp3.py | tee /tmp/dnp3.log
          grep -q '^4/4$' /tmp/dnp3.log
      - name: IEC 60870-5-104
        run: |
          set -o pipefail
          python test_iec104.py | tee /tmp/iec104.log
          grep -q '^4/4$' /tmp/iec104.log
      - name: Layer 2 (GOOSE, PROFINET, EtherCAT)
        run: |
          set -o pipefail
          for t in test_goose test_profinet test_ethercat; do
            sudo -E env "PATH=$PATH" python $t.py | tee /tmp/$t.log
            grep -q '^2/2$' /tmp/$t.log
          done
      - name: Modbus TCP
        run: |
          set -o pipefail
          python test_modbus.py | tee /tmp/modbus.log
          grep -q '^1/1$' /tmp/modbus.log
      - name: EmberCORE sign-in
        run: |
          set -o pipefail
          python test_signin.py | tee /tmp/signin.log
          grep -q '^RESULT: PASS$' /tmp/signin.log
