name: App Invariants
# app-invariants: fixtures
#
# ^ The canary at the bottom is a known-bad manifest on purpose. Without the
# marker the checker flags this file wherever it scans it (embernet-iac scans
# templates/), and the only way to green would be deleting the canary.

# Enforces embernet-iac templates/app/README.md against this repo's charts.
#
# Every rule corresponds to an outage, and every one is SILENT: the workload
# comes up, reports healthy, passes a TCP connect, and moves no traffic.
#
# THE CHECKER IS VENDORED under .ci/, deliberately. The canonical copy lives in
# embernet-iac templates/app/, which is private, so a cross-repo checkout needs
# a token most of these repos do not have. The drift that vendoring risks is
# handled rather than ignored: both regression suites are vendored beside the
# tools and run FIRST, so a copy that has rotted fails its own tests instead of
# reporting a confident green.
#
# To refresh: copy check-app-invariants.py, test-check-app-invariants.py,
# render-charts.py and test-render-charts.py from embernet-iac templates/app/
# into .ci/, and this file from templates/app/app-invariants.chart-repo.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: azure/setup-helm@v4
        with: { version: v3.16.2 }

      # FIRST. A result measured with an unverified checker is worth nothing.
      - name: Prove the checker works before trusting it
        id: checker-suite
        run: python3 .ci/test-check-app-invariants.py

      # Same deal for the renderer. The shell loop it replaced skipped every
      # chart under charts/, which is where most of these repos keep theirs, so
      # the gate rendered nothing there and still said green.
      - name: Prove the renderer works before trusting it
        id: renderer-suite
        run: python3 .ci/test-render-charts.py

      # Every chart, with defaults AND with every examples/ and ci/ values file
      # this repo ships, because HA and the other modes are where the mistakes
      # nobody looked at live. A render that breaks fails the job; a render the
      # chart refuses on purpose is printed and checked the other ways.
      - name: Render every chart, every way it ships
        run: python3 .ci/render-charts.py --out .rendered .

      # Runs even when a render broke. The job is already failing then, but
      # everything that DID render, and the raw chart dirs, still get checked,
      # so one broken example cannot hide a violation somewhere else. The old
      # loop never failed a render, so the checker always ran; this keeps that.
      - name: Check app invariants
        if: ${{ !cancelled() && steps.checker-suite.outcome == 'success' && steps.renderer-suite.outcome == 'success' }}
        run: |
          set -euo pipefail
          TARGETS=""
          for d in charts chart; do [ -d "$d" ] && TARGETS="$TARGETS $d"; done
          # Only pass .rendered if something rendered. The checker refuses a
          # NAMED path that matched zero files, correctly, since a silently
          # empty scan is the failure it exists to prevent.
          if [ -n "$(ls -A .rendered 2>/dev/null)" ]; then TARGETS="$TARGETS .rendered"; fi
          # Fall back to the whole repo. Not every repo has charts: Fragua-Demo
          # holds the Ziti wiring SCRIPTS, and those .py files are where the
          # intercept literals live. "No charts" must not mean "nothing to check".
          [ -n "$TARGETS" ] || TARGETS="."
          echo "scanning:$TARGETS"
          python3 .ci/check-app-invariants.py $TARGETS

      - name: Prove it still catches a violation
        if: ${{ !cancelled() && steps.checker-suite.outcome == 'success' }}
        run: |
          mkdir -p /tmp/canary
          cat > /tmp/canary/canary.yaml <<'EOF'
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: canary
          spec:
            template:
              spec:
                hostNetwork: true
                dnsPolicy: Default
          EOF
          if python3 .ci/check-app-invariants.py /tmp/canary; then
            echo "::error::the checker PASSED a known-bad manifest - it is not working"
            exit 1
          fi
          echo "checker correctly rejected the canary"
